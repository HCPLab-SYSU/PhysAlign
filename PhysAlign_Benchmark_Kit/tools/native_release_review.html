<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'">
<title>PhysAlign 发布审核（私有）</title>
<style>body{font:15px system-ui;max-width:1450px;margin:24px auto;padding:0 16px;background:#f4f6f8;color:#172536}section,header{background:white;padding:18px;border:1px solid #ced8e0;border-radius:10px;margin-bottom:16px}header{position:sticky;top:0;z-index:3}button,select,input,textarea{font:inherit;padding:8px;margin:4px}button{cursor:pointer}textarea{width:96%;min-height:80px}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{overflow-wrap:anywhere}#images{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}img{max-width:100%}label{display:block;padding:5px}.warning{color:#9a4900}.success{color:#166334}[hidden]{display:none!important}</style>
<header><h2>PhysAlign 发布审核</h2><p class="warning" id="purpose"></p>
<input id="reviewer" placeholder="真实审核人 / 团队 ID">
<select id="split"><option value="all">全部划分</option><option value="development_reserved">开发母题</option><option value="candidate_unassigned_not_release">测试候选母题</option></select>
<select id="task"><option value="all">全部接口</option><option>T02-single</option><option>T03-image</option><option>T03-text</option></select>
<select id="mother"><option value="all">全部母题</option></select>
<select id="status"><option value="all">全部状态</option><option value="pending">待审核</option><option value="approved">通过</option><option value="rejected">退回</option></select>
<button id="prev">上一条</button><button id="next">下一条</button><span id="count"></span>
<button id="export">导出已提交记录</button><label>导入同版本记录（先导入再继续）：<input id="import" type="file" accept=".json"></label><small id="notice"></small>
</header>
<main id="main"><section><h3 id="title"></h3><small id="scope"></small><pre id="raw"></pre><div id="images"></div></section>
<section><h3>1. 先根据 Raw 公开输入独立作答</h3><textarea id="blind" placeholder='例如 {"read":"m","owner":"E2"}；不能唯一判断时如实说明。'></textarea><button id="reveal">2. 查看金标准、Gold 输入与来源</button></section>
<section id="gold" hidden><h3>2. 核查局部问题与全部来源</h3><a id="source" target="_blank" rel="noopener">完整 Pass4</a> · <a id="audit" target="_blank" rel="noopener">源审计</a>
<details><summary>实际 Gold 公开输入（图片与上方相同；仅 packet 条件改变）</summary><pre id="goldPrompt"></pre></details><pre id="truth"></pre>
<div id="checks"></div><label>问题分类：<select id="severity"><option value="none">无问题</option><option value="minor">不影响判断的轻微排版问题</option><option value="serious">孤立严重源事实/范围问题（隔离整道母题）</option><option value="systemic">系统性规则错误（停止该规则版本发布）</option><option value="information">严重信息/版本/packet 泄漏（停止发布）</option><option value="unresolved">无法确定/存在争议（不能批准）</option></select></label>
<textarea id="note" placeholder="退回时必填具体原因和相关源 ID。不要根据模型对错筛选题目。"></textarea>
<button id="approve">确认本条通过</button><button id="reject">退回并记录分类</button><p class="warning">点击后仅保存在本页内存；关闭/刷新前必须导出到审核目录之外。不会改写源 Pass、图片或草稿。</p></section></main>
<script>"use strict";
const DATA=__DATA__;
const $=id=>document.getElementById(id), records=Object.create(null), labels={source_semantics:'来源支持问题语义；未偷用解答或 Pass5',complete_targets:'已核查完整来源及单目标依据，没有遗漏目标制造单选',distinct_candidates:'全部候选可区分，身份与映射正确',rendered_locations:'已看实际原图/全部定位图，R/E/H 精确且不遮挡关键信息',packet_no_binding_leakage:'Gold packet 已核查，只有独立转写，不泄漏 owner/E 答案；空 packet 确认为不适用',diagram_asset_scope:'read/packet 来自题图而非选项/解答；文本分支确认为不适用'};
let visible=[],position=0,current=null,dirty=false,sequence=0,revealedSequence=null;
function notice(s){$('notice').textContent=s}
function leave(){return !dirty||confirm('当前内容还未点击通过/退回，将丢失。仍要离开吗？')}
function rebuild(){visible=DATA.items.filter(i=>($('split').value==='all'||i.split===$('split').value)&&($('task').value==='all'||i.metadata.interface===$('task').value)&&($('mother').value==='all'||i.problem_id===$('mother').value)&&($('status').value==='all'||(records[i.logical_probe_id]?.status||'pending')===$('status').value));position=Math.max(0,Math.min(position,visible.length-1));show()}
function show(){current=visible[position];dirty=false;revealedSequence=null;$('main').hidden=!current;$('count').textContent=`${visible.length?position+1:0}/${visible.length} · 已提交 ${Object.values(records).filter(x=>x.status!=='pending').length}/${DATA.items.length}`;if(!current)return;
const d=records[current.logical_probe_id],c=current.core;$('title').textContent=current.problem_id+' · '+current.metadata.interface;$('scope').textContent=(DATA.required_mothers.includes(current.problem_id)?'本角色基础必审母题':'额外/升级二审母题（以 audit-assess 清单为准）')+' · '+current.review_target_root;
$('raw').textContent=c.public_raw.messages.system+'\n\n'+c.public_raw.messages.user;$('images').replaceChildren();for(const aid of c.public_raw.attachment_ids){const f=document.createElement('figure'),cap=document.createElement('figcaption'),im=document.createElement('img');cap.textContent=aid;im.src=current.asset_base+'/'+c.assets[aid].relative_path;im.alt='定位图 '+aid;f.append(cap,im);$('images').append(f)}
$('blind').value=d?.blind_answer||'';$('blind').readOnly=Boolean(d&&d.status!=='pending');$('note').value=d?.note||'';$('severity').value=d?.severity||'none';$('gold').hidden=true;$('checks').replaceChildren();for(const name of DATA.confirmations){const l=document.createElement('label'),x=document.createElement('input');x.type='checkbox';x.dataset.name=name;x.checked=d?.confirmations?.[name]===true;x.onchange=()=>dirty=true;l.append(x,document.createTextNode(labels[name]));$('checks').append(l)}
const k=c.private_core,correct=Object.entries(k.candidate_map).filter(([a,t])=>k.gold_targets.some(g=>g.kind===t.kind&&g.id===t.id)).map(([a])=>a);$('truth').textContent=JSON.stringify({expected_binding_aliases:correct,read:k.read_targets,packet:c.gold_view.recognition_packet,source_records:k.source_records,native_diagnostics:current.metadata,private_mapping:k},null,2);$('goldPrompt').textContent=c.public_gold.messages.system+'\n\n'+c.public_gold.messages.user;$('source').href=current.asset_base+'/sources/pass4.json';$('audit').href=current.asset_base+'/source_audit.json';}
function firstAllowed(){if(DATA.role==='individual'||DATA.role==='adjudication')return true;const first=DATA.blind_first[current.problem_id];return current.logical_probe_id===first||(records[first]&&records[first].status!=='pending')}
$('reveal').onclick=()=>{if(!current)return;if(!$('blind').value.trim())return alert('先记录独立判断');if(!firstAllowed())return alert('请先审核该母题预先随机指定的第一条探针；选母题后第一页即为该条。');if(revealedSequence===null)revealedSequence=records[current.logical_probe_id]?.sequence||++sequence;$('gold').hidden=false;dirty=true};
function decide(status){if(!current||$('gold').hidden)return alert('请先独立作答并核对金标准');if(!$('reviewer').value.trim()||!$('blind').value.trim())return alert('审核人与独立判断必填');const severity=$('severity').value,confirmations={};for(const x of $('checks').querySelectorAll('input'))confirmations[x.dataset.name]=x.checked;if(status==='approved'&&(!['none','minor'].includes(severity)||Object.values(confirmations).some(x=>!x)))return alert('通过需要全部确认且没有严重/未决问题');if(status==='rejected'&&(['none','minor'].includes(severity)||!$('note').value.trim()))return alert('退回必须选择严重/未决分类并写明原因');records[current.logical_probe_id]={logical_probe_id:current.logical_probe_id,review_target_root:current.review_target_root,status,reviewer:$('reviewer').value.trim(),blind_answer:$('blind').value,confirmations,note:$('note').value,severity,sequence:revealedSequence};dirty=false;notice('已提交到本页内存，请及时导出。');position=Math.min(position+1,visible.length-1);rebuild()}
$('approve').onclick=()=>decide('approved');$('reject').onclick=()=>decide('rejected');$('prev').onclick=()=>{if(leave()){position--;rebuild()}};$('next').onclick=()=>{if(leave()){position++;rebuild()}};
for(const id of ['split','task','mother','status'])$(id).onchange=()=>{if(!leave())return;position=0;rebuild()};for(const id of ['blind','note','severity'])$(id).oninput=()=>dirty=true;
$('export').onclick=()=>{if(dirty&&!confirm('当前未提交内容不会导出。是否只导出之前已提交的记录？'))return;const payload={schema_version:'native_release_reviews_v1',catalog_root:DATA.catalog_root,context_root:DATA.context_root,role:DATA.role,decisions:Object.values(records)};const url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='physalign_'+DATA.role+'_reviews.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice('已请求下载；请确认浏览器保存成功。只导出了已提交记录。')};
function validateImport(d){const legacy=d.schema_version==='physalign_decisions_v1';if(d.catalog_root!==DATA.catalog_root||(!legacy&&(d.schema_version!=='native_release_reviews_v1'||d.context_root!==DATA.context_root||d.role!==DATA.role))||(legacy&&DATA.role!=='individual')||!Array.isArray(d.decisions))throw Error('不是本版本/角色的记录');const incoming=Object.create(null);for(const orig of d.decisions){const x={...orig},i=DATA.items.find(i=>i.logical_probe_id===x.logical_probe_id);if(!i||incoming[x.logical_probe_id]||x.review_target_root!==i.review_target_root)throw Error('重复、未知或过期记录');const fields=['logical_probe_id','review_target_root','status','reviewer','blind_answer','confirmations','note',...(legacy?[]:['severity','sequence'])].sort();if(JSON.stringify(Object.keys(x).sort())!==JSON.stringify(fields))throw Error('字段不符合审核格式');if(!['pending','approved','rejected'].includes(x.status)||!['reviewer','blind_answer','note'].every(k=>typeof x[k]==='string')||!x.confirmations||JSON.stringify(Object.keys(x.confirmations).sort())!==JSON.stringify([...DATA.confirmations].sort())||Object.values(x.confirmations).some(v=>typeof v!=='boolean'))throw Error('非法状态或确认字段');if(legacy){x.severity=x.status==='rejected'?'unresolved':'none';x.sequence=null}if(!['none','minor','serious','systemic','information','unresolved'].includes(x.severity)||!(x.sequence===null||(Number.isInteger(x.sequence)&&x.sequence>0)))throw Error('非法分类/顺序');if(x.status!=='pending'&&(!x.reviewer.trim()||!x.blind_answer.trim()||(DATA.role!=='individual'&&x.sequence===null)))throw Error('缺审核人/独立判断/审核顺序');if(x.status==='approved'&&(!['none','minor'].includes(x.severity)||Object.values(x.confirmations).some(v=>v!==true)))throw Error('通过记录缺少确认');if(x.status==='rejected'&&(['none','minor'].includes(x.severity)||!x.note.trim()))throw Error('退回记录缺少分类/原因');incoming[x.logical_probe_id]=x}return incoming}
$('import').onchange=async()=>{try{if(dirty||Object.keys(records).length)throw Error('请先导出当前记录，重新打开页面后再导入；不静默覆盖已有审核。');const f=$('import').files[0];if(!f)return;const incoming=validateImport(JSON.parse(await f.text()));Object.assign(records,incoming);sequence=Math.max(0,...Object.values(records).map(d=>d.sequence||0));rebuild();notice('导入成功；旧版退回记录需补充问题分类。')}catch(e){alert(e.message)}};
for(const pid of [...new Set(DATA.items.map(i=>i.problem_id))]){const o=document.createElement('option');o.value=pid;o.textContent=pid;$('mother').append(o)}
$('purpose').textContent=DATA.role==='individual'?'逐项发布审核（含旧开发集）；全部通过的母题才可进入发布申请。开发集不会变成测试集。':`批次审核角色：${DATA.role}。主随机样本和附加风险样本分开计数；二审须独立，出现漏检可能升级到全审计面板。`;
window.addEventListener('beforeunload',e=>{if(dirty||Object.keys(records).length){e.preventDefault();e.returnValue=''}});rebuild();
</script></html>
